name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest :core:engine:test --continue 2>&1 | tee gradle-test.log || true
          # Surface Kotlin compiler errors as annotations
          grep -E '^e: ' gradle-test.log | head -25 | sed 's/^/::error title=KotlinCompile::/' || true
          # Surface failed tests as annotations
          grep -E 'FAILED$' gradle-test.log | grep -v 'Task' | head -25 | sed 's/^/::error title=TestFailure::/' || true
          if grep -q 'BUILD FAILED' gradle-test.log; then exit 1; fi

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
