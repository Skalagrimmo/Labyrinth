name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test 2>&1 | tee gradle-test-output.log

      - name: Annotate unit-test failures
        if: failure()
        run: |
          grep -E '^e: |FAILED|Execution failed for task|BUILD FAILED|Exception' gradle-test-output.log | head -30 > /tmp/failure-lines.txt || true
          if [ -s /tmp/failure-lines.txt ]; then while read -r line; do echo "::error::$line"; done < /tmp/failure-lines.txt; else echo '::error::no matching failure lines found in gradle output'; fi

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
