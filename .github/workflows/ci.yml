name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test 2>&1 | tee gradle-tests.log
        continue-on-error: true

      - name: Run lint
        run: ./gradlew lintDebug 2>&1 | tee gradle-lint.log
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug 2>&1 | tee gradle-assemble.log
        continue-on-error: true

      - name: FAILDETAIL-ANNOTATE
        if: always()
        run: |
          echo "Emitting error annotations"
          grep -hE '^e: ' gradle-tests.log gradle-lint.log gradle-assemble.log 2>/dev/null | head -12 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -hE 'Error: ' gradle-lint.log 2>/dev/null | head -5 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -hE '> Task.*FAILED' gradle-tests.log gradle-lint.log gradle-assemble.log 2>/dev/null || true
          exit 0

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
