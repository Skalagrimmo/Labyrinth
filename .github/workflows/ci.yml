name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test --continue 2>&1 | tee gradle-test.log

      - name: Post test failure summary to PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('gradle-test.log', 'utf8').split('\n');
            const lines = log.filter(l => l.trim().startsWith('e: ') || l.trim().endsWith('FAILED'));
            const body = lines.length
              ? 'Gradle failure summary:\n' + lines.slice(0, 120).join('\n')
              : 'Gradle failed but no error lines were captured. Check the full log.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
