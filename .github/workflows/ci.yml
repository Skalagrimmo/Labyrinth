name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest :core:engine:test --continue 2>&1 | tee gradle-test.log || true
          if grep -q 'BUILD FAILED' gradle-test.log; then
            {
              echo "BUILD FAILED - captured diagnostics:"
              echo ""
              echo "### Compiler errors"
              echo '~~~'
              grep -E '^e: ' gradle-test.log | head -30 || echo "(none)"
              echo '~~~'
              echo "### Failed tests"
              echo '~~~'
              grep -E 'FAILED$' gradle-test.log | grep -v Task | head -30 || echo "(none)"
              echo '~~~'
              echo "### Task failure context"
              echo '~~~'
              grep -B2 -A8 'FAILURE: Build failed' gradle-test.log | head -40 || echo "(none)"
              echo '~~~'
            } > /tmp/failure-diagnostics.md
            exit 1
          fi

      - name: Post failure diagnostics to PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Unit test step failed, but no diagnostics file was captured.';
            if (fs.existsSync('/tmp/failure-diagnostics.md')) {
              body = fs.readFileSync('/tmp/failure-diagnostics.md', 'utf8');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 6000)
            });

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
