name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test 2>&1 | tee gradle-test.log

      - name: Run lint
        run: |
          set -o pipefail
          ./gradlew lintDebug 2>&1 | tee gradle-lint.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee gradle-assemble.log

      - name: Diagnostics
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const globber = await glob.create('**/build/test-results/**/*.xml');
            const files = await globber.glob();
            let out = [];
            for (const f of files) {
              const t = fs.readFileSync(f, 'utf8');
              const re = /<failure[^>]*message="([^"]*)"/g;
              let m;
              while ((m = re.exec(t)) !== null) out.push(String(m[1]).slice(0, 300));
            }
            for (const log of ['gradle-test.log','gradle-lint.log','gradle-assemble.log']) {
              if (!fs.existsSync(log)) continue;
              for (const line of fs.readFileSync(log, 'utf8').split('\n')) {
                if (/^e: /.test(line) || /FAILED$/.test(line) || /What went wrong/.test(line) || /Caused by:/.test(line)) out.push(line.slice(0, 300));
              }
            }
            for (const l of out.slice(0, 10)) core.error(String(l).slice(0, 200));

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
