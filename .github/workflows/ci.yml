name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test 2>&1 | tee gradle-tests.log
        continue-on-error: true

      - name: Run lint
        run: ./gradlew lintDebug 2>&1 | tee gradle-lint.log
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug 2>&1 | tee gradle-assemble.log
        continue-on-error: true

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const names = ['gradle-tests.log', 'gradle-lint.log', 'gradle-assemble.log'];
            let body = 'CI FAILDETAIL v3 (diagnostic run)\n';
            for (const f of names) {
              if (!fs.existsSync(f)) continue;
              const text = fs.readFileSync(f, 'utf8');
              const lines = text.split('\n');
              const errs = lines.filter(l => l.startsWith('e: ') || l.includes('Error: ') || l.includes(' FAILED') || l.includes('FAILURE') || l.includes('What went wrong') || l.includes('> Task').includes ? false : false);
              const picked = [];
              for (let i = 0; i < lines.length; i++) {
                const l = lines[i];
                if (l.startsWith('e: ') || l.includes('Error: ') || l.includes(' FAILED') || l.startsWith('FAILURE') || l.includes('What went wrong')) {
                  for (let k = i; k < Math.min(i + 6, lines.length); k++) picked.push(lines[k]);
                  i = i + 6;
                }
              }
              if (picked.length > 0) body += '\n**' + f + '**\n' + picked.slice(0, 80).join('\n') + '\n';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
