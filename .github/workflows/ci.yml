name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test --continue 2>&1 | tee gradle-test.log

      - name: Report Gradle failure lines
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const lines = fs.readFileSync('gradle-test.log', 'utf8').split('\n');
              const failures = lines.filter(l => l.startsWith('e: ') || l.includes('FAILED') || l.includes('What went wrong') || l.includes('Caused by'));
              body = 'Gradle failure lines:\n\`\`\`\n' + failures.slice(0, 40).join('\n') + '\n\`\`\`';
            } catch (err) {
              body = 'Could not read gradle-test.log: ' + err.message;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
