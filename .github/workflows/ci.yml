name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test --continue | tee gradle-full.log
        continue-on-error: true

      - name: FAILDETAIL
        if: always()
        run: |
          echo "=== KOTLIN COMPILE ERRORS ===" > faildetail.md
          grep '^e: ' gradle-full.log | head -60 >> faildetail.md
          echo "" >> faildetail.md
          echo "=== FAILED TASKS ===" >> faildetail.md
          grep -E 'FAILURE|FAILED|failed,' gradle-full.log | head -20 >> faildetail.md
          echo "" >> faildetail.md
          echo "=== FAILURE CONTEXT ===" >> faildetail.md
          grep -B2 -A8 'FAILURE: Build failed' gradle-full.log | head -60 >> faildetail.md
          echo "" >> faildetail.md
          echo "=== FAILED TEST XML ===" >> faildetail.md
          find . -path '*/test-results/*' -name '*.xml' -exec grep -l 'failure' {} \; | head -5 | while read f; do echo "--- $f" >> faildetail.md; grep -A5 '<failure' "$f" | head -20 >> faildetail.md; done
          cat faildetail.md

      - name: Run lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = '';
            try { detail = fs.readFileSync('faildetail.md', 'utf8'); } catch (e) { detail = 'no faildetail'; }
            const body = 'DIAGNOSTIC v1 (slice 3):\n```\n' + detail.slice(0, 24000) + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
