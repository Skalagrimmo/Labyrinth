name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test 2>&1 | tee gradle-full.log

      - name: FAILDETAIL
        if: always()
        run: |
          {
            echo "### Kotlin compile errors (e: lines)"
            grep -E "^e: " gradle-full.log | sort -u | head -80 || echo "(none)"
            echo ""
            echo "### Failing test XMLs"
            FILES=$(grep -rlE 'failures="[1-9]' --include="TEST-*.xml" . 2>/dev/null | head -10)
            if [ -z "$FILES" ]; then echo "(none)"; else
              for f in $FILES; do
                echo "=== $f"
                grep -oE 'testcase name="[^"]+"' "$f" | head -20
                grep -A 6 "<failure" "$f" | head -24
              done
            fi
          } > faildetail.txt 2>&1 || true
          cat faildetail.txt

      - name: Comment failure details on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = '(no faildetail.txt)';
            try { detail = fs.readFileSync('faildetail.txt', 'utf8'); } catch (e) {}
            const body = 'CI failure details:' + '\n\n' + '```' + '\n' + detail.slice(0, 5500) + '\n' + '```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

      - name: Run lint
        if: steps.tests.outcome == 'success'
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        if: steps.tests.outcome == 'success'
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: steps.tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
