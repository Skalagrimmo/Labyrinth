name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test 2>&1 | tee gradle-tests.log
        continue-on-error: true

      - name: Run lint
        run: ./gradlew lintDebug 2>&1 | tee gradle-lint.log
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug 2>&1 | tee gradle-assemble.log
        continue-on-error: true

      - name: FAILDETAIL
        if: always()
        run: |
          echo "=== COMPILE ERRORS ==="
          grep -E "^e: " gradle-tests.log gradle-lint.log gradle-assemble.log || true
          echo "=== LINT ERRORS ==="
          grep -E "Error: " gradle-lint.log | head -50 || true
          echo "=== FAILING TEST XML ==="
          find . -path "*/test-results/*/TEST-*.xml" -newer gradlew | xargs -r grep -l -E "<failure|<error" || true

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const glob = require('@actions/glob');
            const globber = await glob.create('gradle-*.log');
            const files = await globber.glob();
            let body = 'CI FAILDETAIL (diagnostic run)\n';
            for (const f of files) {
              const text = fs.readFileSync(f, 'utf8');
              const errs = text.split('\n').filter(l => l.startsWith('e: ') || l.includes('Error: ')).slice(0, 40);
              if (errs.length > 0) body += '\n**' + f + '**\n' + errs.join('\n') + '\n';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
