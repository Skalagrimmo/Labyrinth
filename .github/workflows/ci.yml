name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test --continue 2>&1 | tee gradle-test.log || true

      - name: Run lint
        run: ./gradlew lintDebug --continue 2>&1 | tee gradle-lint.log || true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --continue 2>&1 | tee gradle-assemble.log || true

      - name: Post failure diagnostics
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = [];
            for (const f of ['gradle-test.log', 'gradle-lint.log', 'gradle-assemble.log']) {
              if (!fs.existsSync(f)) continue;
              const text = fs.readFileSync(f, 'utf8');
              const interesting = text.split('\n').filter(l => l.startsWith('e: ') || l.includes('FAILED') || l.includes('What went wrong') || l.includes('Caused by'));
              for (const l of interesting.slice(0, 80)) lines.push('[' + f + '] ' + l);
            }
            if (lines.length === 0) lines.push('No interesting lines found');
            const body = '## CI Diagnostics\n```\n' + lines.join('\n') + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail if errors found
        run: |
          if grep -qE 'e: |FAILED|What went wrong' gradle-test.log gradle-lint.log gradle-assemble.log 2>/dev/null; then
            echo 'Gradle errors detected'
            exit 1
          fi
