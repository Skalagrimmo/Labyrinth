name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test 2>&1 | tee gradle-full.log
        continue-on-error: true

      - name: FAILDETAIL
        if: always()
        run: |
          {
            echo '### CI failure detail (auto-diagnostic)'
            echo '#### Kotlin compile errors'
            grep '^e: ' gradle-full.log | head -50 || echo '(none)'
            echo '#### Gradle failure section'
            grep -A 5 -B 5 'FAILURE\|What went wrong' gradle-full.log | head -60 || echo '(none)'
            echo '#### Failing test XML'
            find . -path '*/build/test-results/*/*.xml' -newer settings.gradle.kts 2>/dev/null | head -5 || echo '(none)'
          } > faildetail.md

      - name: Comment on PR
        if: always() && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('faildetail.md', 'utf8').slice(0, 60000) || '(no detail captured)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
