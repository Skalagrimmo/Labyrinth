name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test 2>&1 | tee gradle-full.log
        continue-on-error: true

      - name: FAILDETAIL
        if: always()
        run: |
          {
            echo '### CI failure detail (auto-diagnostic v2)'
            echo '#### Which task failed'
            grep -E '^> Task .*(FAILED|ksp)' gradle-full.log | tail -30 || echo '(none)'
            echo '#### ApplicationManager context'
            grep -B 10 -A 5 'ApplicationManager' gradle-full.log | head -60 || echo '(none)'
            echo '#### FAILURE section'
            sed -n '/FAILURE/,/^$/p' gradle-full.log | head -40 || echo '(none)'
            echo '#### Kotlin compile errors'
            grep '^e: ' gradle-full.log | head -30 || echo '(none)'
          } > faildetail.md || true

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '(no detail captured)';
            try { body = fs.readFileSync('faildetail.md', 'utf8').slice(0, 25000); } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
