name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest :core:engine:test :core:persistence:test :core:content:test :core:render:test :core:game:test :core:audio:test :feature:skilltree:test :feature:combat:test :feature:exploration:test :feature:cosmetic:test :feature:inventory:test 2>&1 | tee /tmp/test-output.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            grep -E '^e: ' /tmp/test-output.log | head -40 > /tmp/fails.txt || true
            grep -E 'FAILED' /tmp/test-output.log | head -40 >> /tmp/fails.txt || true
            find . -path '*build/test-results*' -name 'TEST-*.xml' | while read -r f; do
              grep -l '<failure' "$f" >/dev/null 2>&1 || continue
              echo "XMLSUITE $f" >> /tmp/fails.txt
              sed -n 's/.*<testcase name="\([^"]*\)".*/CASE: \1/p' "$f" >> /tmp/fails.txt
              sed -n 's/.*<failure[^>]*message="\([^"]*\)".*/FAILMSG: \1/p' "$f" | head -12 >> /tmp/fails.txt
            done
            tr -d '\r' < /tmp/fails.txt | sed 's/%/%25/g' | head -250 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-250)"
            done
            exit "$code"
          fi

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
